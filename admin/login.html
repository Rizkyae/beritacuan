<!doctype html>
<html lang="id" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Login admin BERITA CUAN.">

    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<body data-admin-page="login">
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html"><span class="brand-mark">B<span>.</span></span><span>BERITA <b>CUAN</b></span></a><a class="text-link" href="../index.html">← Kembali ke situs</a></div></header>
<main class="login-wrap">
    <section class="login-card">
        <span class="section-kicker">Area redaksi</span><h1>Masuk admin.</h1>
        <p>Gunakan akun Supabase yang memiliki role admin.</p>
        <div class="alert" data-admin-message hidden></div>
        <form data-login-form>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
            <div class="field"><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
            <button class="button button-dark" type="submit">Masuk →</button>
        </form>
    </section>
</main>
<footer class="site-footer"><div class="container footer-bottom"><span>© <span data-current-year></span> BERITA CUAN</span><span>Area admin</span></div></footer>
